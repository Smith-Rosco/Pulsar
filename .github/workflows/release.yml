name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -like 'v*') { $ver = $ver.Substring(1) }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

      - name: Restore dependencies
        run: dotnet restore Pulsar/Pulsar/Pulsar.csproj

      - name: Publish Full (Self-Contained Single File)
        run: dotnet publish Pulsar/Pulsar/Pulsar.csproj -c Release -o publish/full -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true

      - name: Publish Portable (Framework-Dependent Single File)
        # EnableCompressionInSingleFile=false 必须显式传：csproj 的 RuntimeIdentifier
        # 条件属性为 single-file 打开了压缩，但压缩仅支持 self-contained（NETSDK1176），
        # 与本地 publish skill 的 portable 命令保持一致。
        run: dotnet publish Pulsar/Pulsar/Pulsar.csproj -c Release -o publish/portable -p:RuntimeIdentifier=win-x64 -p:SelfContained=false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false

      - name: Install Inno Setup (ISCC)
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe","C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC not found after choco install" }
          echo "ISCC: $($iscc.FullName)"
          echo "ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Setup.exe (ISCC)
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          # pulsar.iss 硬编码源路径为 artifacts\publish\stage\Pulsar.exe
          New-Item -ItemType Directory -Path artifacts\publish\stage -Force | Out-Null
          Copy-Item publish\full\Pulsar.exe artifacts\publish\stage\ -Force
          & $env:ISCC_PATH /DAppVersion=$ver scripts\installer\pulsar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path "artifacts\publish\Pulsar-v$ver-Setup.exe")) { throw "Setup.exe not produced" }
          echo "Setup.exe: $((Get-Item "artifacts\publish\Pulsar-v$ver-Setup.exe").Length) bytes"

      - name: Build Standalone zip + SHA256SUMS
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          # Standalone zip = full 产物的单文件打包（对齐 dev.ps1 publish 命名）
          New-Item -ItemType Directory -Path standalone-stage -Force | Out-Null
          Copy-Item publish\full\Pulsar.exe standalone-stage\ -Force
          Compress-Archive -Path standalone-stage\* -DestinationPath "Pulsar-v$ver-Standalone-win-x64.zip" -Force
          # SHA256SUMS
          $files = @("Pulsar-v$ver-Standalone-win-x64.zip")
          if (Test-Path "artifacts\publish\Pulsar-v$ver-Setup.exe") { $files += "artifacts\publish\Pulsar-v$ver-Setup.exe" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path $f -Leaf
            "$hash  $name"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Verify publish output (Full)
        shell: pwsh
        run: |
          foreach ($f in @('Pulsar.exe', 'Pulsar.pdb')) {
            if (-not (Test-Path "publish/full/$f")) { throw "缺少 full/$f" }
          }
          # .NET 8 单文件自包含把运行时嵌入 Pulsar.exe（IncludeNativeLibrariesForSelfExtract），
          # 无独立 *_cor3.dll——以 exe 体积断言自包含（对齐 publish skill：full >= 50MB）。
          $exe = (Get-Item 'publish/full/Pulsar.exe').Length
          if ($exe -lt 50MB) { throw "full Pulsar.exe too small ($([math]::Round($exe/1MB,1)) MB); runtime not embedded" }
          if (-not (Test-Path 'publish/full/Assets')) { throw "缺少 Assets/ (full)" }

      - name: Verify publish output (Portable)
        shell: pwsh
        run: |
          foreach ($f in @('Pulsar.exe', 'Pulsar.pdb')) {
            if (-not (Test-Path "publish/portable/$f")) { throw "缺少 portable/$f" }
          }
          if (-not (Test-Path 'publish/portable/Assets')) { throw "缺少 Assets/ (portable)" }
          if (Get-ChildItem publish/portable -Filter '*_cor3.dll' -ErrorAction SilentlyContinue) {
            throw "portable 不应包含 *_cor3.dll（framework-dependent）"
          }

      - name: Upload artifact (Full)
        uses: actions/upload-artifact@v5
        with:
          name: Pulsar-${{ steps.version.outputs.version }}-full
          path: publish/full/
          if-no-files-found: error

      - name: Upload artifact (Portable)
        uses: actions/upload-artifact@v5
        with:
          name: Pulsar-${{ steps.version.outputs.version }}-portable
          path: publish/portable/
          if-no-files-found: error

      - name: Check release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 有效 release = 非 draft 且至少 1 个资产。draft / 空资产视为半成品
          # （如本地上传中断留下的草稿），清理后由 CI 接管，避免 CI 被空 draft 阻塞。
          # runner 的 pwsh 默认 $PSNativeCommandUseErrorActionPreference=$true 且
          # ErrorActionPreference=Stop，任何 gh 命令非零退出（如 release 不存在）都会抛错终止。
          # 关闭该行为，改用 $LASTEXITCODE 显式判断。
          $PSNativeCommandUseErrorActionPreference = $false
          $exists = $false
          $info = $null
          try {
            $info = gh release view "${{ github.ref_name }}" --json isDraft,assets 2>$null | ConvertFrom-Json
          } catch { }
          if ($info) {
            if (-not $info.isDraft -and $info.assets.Count -gt 0) {
              $exists = $true
            } else {
              gh release delete "${{ github.ref_name }}" --yes 2>$null | Out-Null
              Write-Host "已清理半成品 release（draft 或无资产），由 CI 接管"
            }
          }
          $LASTEXITCODE = 0
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=$exists"

      - name: Create Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $name = "Pulsar $tag"
          $repo = "${{ github.repository }}"
          # 显式从 GitHub API 读取 annotated tag message 作为 release notes。
          # 不用 --notes-from-tag：部分 gh 版本上它会退化为 commit subject，
          # 使 body 变成 "chore(release): bump version to X"（2026-09 实测 v1.10.0）。
          # cmd 重定向保持原始字节（PS 管道会经 GBK 重解码损坏中文）。
          cmd /c "gh api repos/$repo/git/ref/tags/$tag --jq .object.sha > %TEMP%\pulsar-tagsha.txt"
          if ($LASTEXITCODE -ne 0) { throw "failed to resolve tag sha for $tag" }
          $sha = (Get-Content -LiteralPath (Join-Path $env:TEMP 'pulsar-tagsha.txt') -Raw).Trim()
          cmd /c "gh api repos/$repo/git/tags/$sha --jq .message > %TEMP%\pulsar-tagmsg.md"
          if ($LASTEXITCODE -ne 0) { throw "failed to read tag message for $tag" }
          gh release create $tag --title "$name" --notes-file (Join-Path $env:TEMP 'pulsar-tagmsg.md')

      - name: Upload Release Assets
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ver = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path publish\full\* -DestinationPath "Pulsar-$ver-full.zip"
          Compress-Archive -Path publish\portable\* -DestinationPath "Pulsar-$ver-portable.zip"
          $assets = @("Pulsar-$ver-full.zip", "Pulsar-$ver-portable.zip")
          # installer (ADR-026): Setup.exe + Standalone zip + SHA256SUMS
          if (Test-Path "artifacts\publish\Pulsar-v$ver-Setup.exe") { $assets += "artifacts\publish\Pulsar-v$ver-Setup.exe" }
          if (Test-Path "Pulsar-v$ver-Standalone-win-x64.zip") { $assets += "Pulsar-v$ver-Standalone-win-x64.zip" }
          if (Test-Path "SHA256SUMS.txt") { $assets += "SHA256SUMS.txt" }
          gh release upload ${{ github.ref_name }} @assets
