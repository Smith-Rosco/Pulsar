name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Pulsar/Pulsar/Pulsar.csproj

      - name: Publish (Self-Contained Single File)
        run: dotnet publish Pulsar/Pulsar/Pulsar.csproj -c Release -o publish -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-${{ github.ref_name }}
          path: publish/

      - name: Verify publish output
        shell: pwsh
        run: |
          # 与本地发布一致的产物校验（cor3 缺失会导致应用无法启动）
          foreach ($f in @('Pulsar.exe', 'Pulsar.pdb')) {
            if (-not (Test-Path "publish/$f")) { throw "缺少 $f" }
          }
          if (-not (Get-ChildItem publish -Filter '*_cor3.dll' -ErrorAction SilentlyContinue)) {
            throw "缺少 *_cor3.dll"
          }
          if (-not (Test-Path 'publish/Assets')) { throw "缺少 Assets/" }

      - name: Check release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 有效 release = 非 draft 且至少 1 个资产。draft / 空资产视为半成品
          # （如本地上传中断留下的草稿），清理后由 CI 接管，避免 CI 被空 draft 阻塞。
          # runner 的 pwsh 默认 $PSNativeCommandUseErrorActionPreference=$true 且
          # ErrorActionPreference=Stop，任何 gh 命令非零退出（如 release 不存在）都会抛错终止。
          # 关闭该行为，改用 $LASTEXITCODE 显式判断。
          $PSNativeCommandUseErrorActionPreference = $false
          $exists = $false
          $info = $null
          try {
            $info = gh release view "${{ github.ref_name }}" --json isDraft,assets 2>$null | ConvertFrom-Json
          } catch { }
          if ($info) {
            if (-not $info.isDraft -and $info.assets.Count -gt 0) {
              $exists = $true
            } else {
              # 有效 release = 非 draft 且至少 1 个资产。draft / 空资产视为半成品
              # （如本地上传中断留下的草稿），清理后由 CI 接管，避免 CI 被空 draft 阻塞。
              gh release delete "${{ github.ref_name }}" --yes 2>$null | Out-Null
              Write-Host "已清理半成品 release（draft 或无资产），由 CI 接管"
            }
          }
          # runner 的 pwsh 包装器以 $LASTEXITCODE 作为步骤退出码；gh view 在
          # release 不存在时返回 1，这里重置，避免把「不存在」当成步骤失败。
          $LASTEXITCODE = 0
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=$exists"

      - name: Create Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $name = "Pulsar $tag"
          gh release create $tag --title "$name" --notes-from-tag

      - name: Upload Release Asset
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Compress-Archive -Path publish\* -DestinationPath Pulsar-${{ github.ref_name }}.zip
          gh release upload ${{ github.ref_name }} Pulsar-${{ github.ref_name }}.zip
