name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Pulsar/Pulsar/Pulsar.csproj

      - name: Publish (Self-Contained Single File)
        run: dotnet publish Pulsar/Pulsar/Pulsar.csproj -c Release -o publish -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-${{ github.ref_name }}
          path: publish/

      - name: Check release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # 发布可能已由 pi 扩展（publish-local）从本地验证过的产物创建；已存在则跳过，避免冲突。
          gh release view "${{ github.ref_name }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=true"
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=false"
          }

      - name: Create Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "Pulsar $tag"
          gh release create $tag --title "$name" --notes-from-tag

      - name: Upload Release Asset
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Pulsar-${{ github.ref_name }}.zip
          gh release upload ${{ github.ref_name }} Pulsar-${{ github.ref_name }}.zip
