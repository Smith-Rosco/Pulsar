name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Pulsar/Pulsar.sln

      - name: Build
        run: dotnet build Pulsar/Pulsar.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Pulsar/Pulsar.Tests/Pulsar.Tests.csproj -c Release --no-build --blame-hang --blame-hang-timeout 5m --verbosity normal

  e2e:
    # Core E2E workflows. windows-latest runners run in an interactive desktop
    # session (session 1), so real SendInput and screen capture work. If a future
    # runner image becomes non-interactive, the driver's pre-flight check
    # (InteractiveDesktopCheck) fails the job cleanly instead of timing out.
    runs-on: windows-latest
    timeout-minutes: 30
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Pulsar/Pulsar.sln

      - name: Build
        run: dotnet build Pulsar/Pulsar.sln -c Release --no-restore

      - name: Run canonical E2E workflows
        working-directory: Pulsar/Pulsar.E2E
        run: |
          dotnet run --project Pulsar.E2E.csproj -c Release --no-build -- run --workflow Workflows/radial-menu-open-via-command.json --app ../Pulsar/bin/Release/net8.0-windows/Pulsar.exe
          dotnet run --project Pulsar.E2E.csproj -c Release --no-build -- run --workflow Workflows/radial-menu-open-via-hotkey.json --app ../Pulsar/bin/Release/net8.0-windows/Pulsar.exe

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: Pulsar/Pulsar.E2E/artifacts/
          if-no-files-found: ignore

